services:
  # Tier 1: Reverse Proxy (Nginx) - Menggunakan image unprivileged (non-root) untuk keamanan
  proxy:
    image: nginxinc/nginx-unprivileged:alpine
    container_name: kel06-proxy
    restart: unless-stopped
    ports:
      - "80:8080"   # HTTP  → redirect ke HTTPS (nginx-unprivileged pakai port >1024)
      - "443:8443"  # HTTPS → main application (SSL/TLS termination)
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro  # Mount sertifikat SSL (read-only)
      - ./docker/app:/var/www/html:ro
      - ./logs/nginx:/var/log/nginx           # Mount logs untuk dipantau Fail2Ban di host
    networks:
      - frontend-net
    depends_on:
      app:
        condition: service_healthy
    # ── Container Security Hardening ──
    security_opt:
      - no-new-privileges:true  # Mencegah privilege escalation di dalam container
    read_only: true             # Filesystem read-only (immutable container)
    tmpfs:
      - /tmp                    # Hanya /tmp yang writable (untuk nginx cache)
      - /var/cache/nginx        # Cache directory writable
      - /var/run                # PID file directory
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider --no-check-certificate https://localhost:8443/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Tier 2: Application Server (Laravel) - Menjalankan PHP-FPM sebagai user laravel (non-root)
  app:
    build:
      context: ./docker/app
      dockerfile: Dockerfile
    container_name: kel06-app
    restart: unless-stopped
    volumes:
      - ./docker/app:/var/www/html
      - ./.env:/var/www/html/.env
    networks:
      - frontend-net
      - backend-net
    depends_on:
      db:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 9000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Tier 3: Database Server (MariaDB) - Terisolasi tanpa eksposur port ke Host (Aman)
  db:
    image: mariadb:10.11
    container_name: kel06-db
    restart: unless-stopped
    # PORT 3306 TIDAK DIEKSPOSE KE HOST (Memenuhi Spesifikasi 4)
    expose:
      - 3306
    env_file:
      - .env
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:-laravel}
      MARIADB_USER: ${DB_USERNAME:-laravel_user}
      MARIADB_PASSWORD: ${DB_PASSWORD:-secret}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-secret_root}
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - backend-net
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h localhost -u $$MARIADB_USER --password=$$MARIADB_PASSWORD || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

# Pemisahan Docker Bridge Network per Tier (Memenuhi Spesifikasi 3)
networks:
  frontend-net:
    driver: bridge
  backend-net:
    driver: bridge

# Persistent Volume untuk Database (Memenuhi Spesifikasi 6)
volumes:
  db-data:
    driver: local
