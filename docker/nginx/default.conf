# ==============================================================================
# default.conf — Nginx Reverse Proxy Configuration (Security Hardened)
# ==============================================================================
# Kelompok 06 — Topik A | Keamanan Server & Jaringan
#
# Fitur Keamanan:
#   - HTTPS/TLS enforcement (TLS 1.2 & 1.3 only)
#   - HTTP → HTTPS redirect otomatis (port 80 → 443)
#   - Security headers (HSTS, CSP, X-Frame-Options, dll)
#   - Rate limiting untuk mitigasi brute-force & DDoS
#   - Server signature hiding
#   - Proteksi terhadap common attacks
#   - DH parameters untuk Perfect Forward Secrecy
#   - OCSP Stapling ready
#   - Gzip compression dengan MIME filter aman
# ==============================================================================

# ─── Rate Limiting Zone ──────────────────────────────────────────────────────
# Membatasi request per IP untuk mitigasi brute-force dan DDoS ringan
# Zone "general" : 10 request/detik per IP (burst 20)
# Zone "login"   : 5 request/detik per IP (burst 10) — lebih ketat untuk auth
limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=login:10m   rate=5r/s;

# ─── Upstream: PHP-FPM Backend ───────────────────────────────────────────────
upstream php_backend {
    server app:9000;
}

# ═══════════════════════════════════════════════════════════════════════════════
# SERVER BLOCK 1: HTTP → HTTPS Redirect (Port 8080)
# ═══════════════════════════════════════════════════════════════════════════════
# nginx-unprivileged tidak bisa bind port <1024, jadi menggunakan 8080
# Docker mapping: host:80 → container:8080

server {
    listen 8080 default_server;
    server_name _;

    # ── Redirect SEMUA traffic HTTP ke HTTPS ──
    # Status 301 = permanent redirect (browser akan cache)
    return 301 https://$host$request_uri;

    # ── Logging untuk monitoring ──
    access_log /var/log/nginx/http_redirect.log;
}

# ═══════════════════════════════════════════════════════════════════════════════
# SERVER BLOCK 2: HTTPS — Main Application (Port 8443)
# ═══════════════════════════════════════════════════════════════════════════════
# Docker mapping: host:443 → container:8443

server {
    listen 8443 ssl http2;
    server_name kel06.local localhost;

    # ── Document Root ──
    root /var/www/html/public;
    index index.php index.html;

    # ── Karakter Encoding ──
    charset utf-8;

    # ==========================================================================
    # SSL/TLS CONFIGURATION (Hardened)
    # ==========================================================================

    # Sertifikat dan Private Key (di-mount via volume di docker-compose.yml)
    ssl_certificate     /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;

    # ── TLS Protocol Versions ──
    # HANYA izinkan TLS 1.2 dan 1.3 (disable SSLv3, TLS 1.0, TLS 1.1 yang sudah deprecated)
    ssl_protocols TLSv1.2 TLSv1.3;

    # ── Cipher Suites (Modern & Secure) ──
    # Urutan cipher ditentukan oleh server (bukan client) untuk keamanan
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305';

    # ── ECDH Curve ──
    ssl_ecdh_curve secp384r1;

    # ── DH Parameters untuk Perfect Forward Secrecy (PFS) ──
    # Generate via: openssl dhparam -out dhparam.pem 2048
    ssl_dhparam /etc/nginx/ssl/dhparam.pem;

    # ── SSL Session Cache ──
    # Mengoptimalkan performa SSL handshake dengan session caching
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;  # Disable session tickets (lebih aman)

    # ── SSL Buffer Size ──
    ssl_buffer_size 4k;  # Optimasi untuk Time-To-First-Byte (TTFB)

    # ==========================================================================
    # SECURITY HEADERS
    # ==========================================================================

    # ── HTTP Strict Transport Security (HSTS) ──
    # Memberitahu browser untuk SELALU menggunakan HTTPS selama 1 tahun
    # includeSubDomains: berlaku juga untuk subdomain
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # ── Content Security Policy (CSP) ──
    # Membatasi sumber konten yang boleh dimuat oleh browser
    # Mencegah XSS, data injection, dan clickjacking
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self';" always;

    # ── X-Frame-Options ──
    # Mencegah website dimuat dalam iframe (anti-clickjacking)
    add_header X-Frame-Options "SAMEORIGIN" always;

    # ── X-Content-Type-Options ──
    # Mencegah browser melakukan MIME-type sniffing
    add_header X-Content-Type-Options "nosniff" always;

    # ── X-XSS-Protection ──
    # Mengaktifkan filter XSS bawaan browser (legacy, tetap diaktifkan untuk kompatibilitas)
    add_header X-XSS-Protection "1; mode=block" always;

    # ── Referrer Policy ──
    # Mengontrol informasi referrer yang dikirim saat navigasi
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Permissions Policy (menggantikan Feature-Policy) ──
    # Membatasi akses ke API browser yang sensitif
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # ── Cross-Origin Policies ──
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    # ==========================================================================
    # SERVER HARDENING
    # ==========================================================================

    # ── Sembunyikan versi Nginx ──
    # Mencegah information disclosure tentang versi server
    server_tokens off;

    # ── Batasi ukuran request body ──
    # Mencegah upload file besar yang bisa digunakan untuk DoS
    client_max_body_size 10m;

    # ── Timeout Configuration ──
    # Timeout ketat untuk mencegah slowloris dan slow POST attacks
    client_body_timeout 12s;
    client_header_timeout 12s;
    send_timeout 10s;
    keepalive_timeout 65s;

    # ── Buffer Overflow Protection ──
    # Membatasi ukuran buffer untuk mencegah buffer overflow attacks
    client_body_buffer_size 16k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;

    # ==========================================================================
    # GZIP COMPRESSION (Aman)
    # ==========================================================================

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # ==========================================================================
    # LOCATION BLOCKS
    # ==========================================================================

    # ── Laravel Front Controller ──
    location / {
        try_files $uri $uri/ /index.php?$query_string;

        # Rate limiting global
        limit_req zone=general burst=20 nodelay;
        limit_req_status 429;
    }

    # ── PHP Processing via FastCGI ──
    location ~ \.php$ {
        # Mencegah eksekusi file PHP yang di-upload (security)
        try_files $uri =404;

        fastcgi_pass php_backend;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;

        # ── FastCGI Security Parameters ──
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_PROXY "";  # Mitigasi httpoxy vulnerability (CVE-2016-5385)

        # ── FastCGI Performance Tuning ──
        fastcgi_buffering on;
        fastcgi_buffer_size 16k;
        fastcgi_buffers 16 16k;
        fastcgi_connect_timeout 60s;
        fastcgi_send_timeout 60s;
        fastcgi_read_timeout 60s;

        # ── Hide PHP version ──
        fastcgi_hide_header X-Powered-By;
    }

    # ── Rate Limit Ketat untuk Halaman Login ──
    # Mencegah brute-force attack pada endpoint autentikasi
    location ~ ^/(login|register|password) {
        try_files $uri $uri/ /index.php?$query_string;

        limit_req zone=login burst=10 nodelay;
        limit_req_status 429;
    }

    # ── Blokir Akses ke File Sensitif ──
    # Mencegah akses ke .env, .git, .htaccess, dan file konfigurasi lainnya
    location ~ /\.(env|git|htaccess|htpasswd|svn|DS_Store) {
        deny all;
        return 404;
    }

    # ── Blokir Akses ke Backup Files ──
    location ~* \.(bak|old|orig|save|swp|swo|tmp|temp|sql|log)$ {
        deny all;
        return 404;
    }

    # ── Cache Static Assets ──
    # Browser caching untuk file statis (mengurangi beban server)
    location ~* \.(css|js|ico|gif|jpeg|jpg|png|svg|webp|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;

        # Security headers tetap diterapkan pada static assets
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ── Blokir Akses ke Direktori Tersembunyi ──
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ── Custom Error Pages ──
    error_page 429 /429.html;
    location = /429.html {
        internal;
        default_type text/html;
        return 429 '<!DOCTYPE html><html><head><title>429 Too Many Requests</title></head><body><h1>429 — Terlalu Banyak Permintaan</h1><p>Anda telah melebihi batas permintaan. Silakan coba lagi nanti.</p></body></html>';
    }

    # ── Logging ──
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;
}
